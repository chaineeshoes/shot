<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>趨勢 vs 逆勢交易</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; }
  #app { width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; background: #fff; }
  .toggle-bar { display: flex; margin-top: 120px; background: #f0f0f0; border-radius: 60px; padding: 8px; width: 720px; }
  .toggle-btn { flex: 1; height: 96px; border: none; border-radius: 52px; font-size: 40px; font-weight: 600; cursor: pointer; transition: background 0.3s, color 0.3s, box-shadow 0.3s; letter-spacing: 2px; background: transparent; color: #999; }
  .toggle-btn.active-up { background: #18499A; color: #fff; box-shadow: 0 6px 24px rgba(24,73,154,0.25); }
  .toggle-btn.active-down { background: #E24B4A; color: #fff; box-shadow: 0 6px 24px rgba(226,75,74,0.25); }
  .label-area { margin-top: 80px; width: 960px; text-align: left; }
  .main-label { font-size: 66px; font-weight: 700; color: #111; letter-spacing: 2px; line-height: 1.15; }
  .sub-label { font-size: 38px; font-weight: 400; color: #888; margin-top: 18px; letter-spacing: 1px; }
  .chart-wrap { margin-top: 50px; width: 1000px; height: 1020px; }
  canvas#kc { width: 1000px; height: 1020px; display: block; }
  .dot-row { display: flex; gap: 18px; margin-top: 50px; justify-content: center; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
  .dot.active-up { background: #18499A; }
  .dot.active-down { background: #E24B4A; }
</style>
</head>
<body>
<div id="app">
  <div class="toggle-bar">
    <button class="toggle-btn active-up" id="btn-trend" onclick="switchMode('trend')">趨勢交易</button>
    <button class="toggle-btn" id="btn-counter" onclick="switchMode('counter')">逆勢交易</button>
  </div>
  <div class="label-area">
    <div class="main-label" id="main-label">市場上漲，找機會買入</div>
    <div class="sub-label" id="sub-label">順著趨勢方向操作，勝率更高</div>
  </div>
  <div class="chart-wrap">
    <canvas id="kc" width="1000" height="1020"></canvas>
  </div>
  <div class="dot-row">
    <div class="dot active-up" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('kc');
const ctx = canvas.getContext('2d');
const W = 1000, H = 1020;
const PAD = { l: 72, r: 36, t: 50, b: 60 };
const CW = W - PAD.l - PAD.r;
const CH = H - PAD.t - PAD.b;
const GREEN = '#26a96c';
const RED   = '#E24B4A';

const trendCandles = [
  {o:44,h:50,l:40,c:48},
  {o:48,h:56,l:44,c:54},
  {o:54,h:62,l:50,c:60},
  {o:60,h:68,l:56,c:64},
  {o:64,h:67,l:52,c:54},   // 4 ← 買點1
  {o:54,h:58,l:48,c:51},   // 5 ← 買點1
  {o:51,h:62,l:49,c:60},
  {o:60,h:72,l:57,c:70},
  {o:70,h:82,l:66,c:80},
  {o:80,h:90,l:76,c:88},
  {o:88,h:96,l:84,c:92},
  {o:92,h:95,l:78,c:81},   // 11 ← 買點2
  {o:81,h:85,l:74,c:77},   // 12 ← 買點2
  {o:77,h:90,l:74,c:88},
  {o:88,h:100,l:84,c:98},
  {o:98,h:112,l:94,c:110},
  {o:110,h:124,l:106,c:122},
  {o:122,h:136,l:118,c:133},
];
const trendMarks = [{ spanIdx:[4,5] }, { spanIdx:[11,12] }];
const trendDelay = [1200, 2400];

const counterCandles = [
  {o:128,h:134,l:122,c:130},
  {o:130,h:135,l:124,c:127},
  {o:127,h:130,l:112,c:115},
  {o:115,h:118,l:102,c:106},
  {o:106,h:110,l:96,c:99},
  {o:99,h:110,l:96,c:108},  // 5 ← 做空1
  {o:108,h:116,l:104,c:112},// 6 ← 做空1
  {o:112,h:115,l:98,c:101},
  {o:101,h:105,l:88,c:92},
  {o:92,h:96,l:78,c:82},
  {o:82,h:86,l:68,c:72},
  {o:72,h:82,l:69,c:80},    // 11 ← 做空2
  {o:80,h:88,l:76,c:85},    // 12 ← 做空2
  {o:85,h:88,l:70,c:74},
  {o:74,h:78,l:60,c:64},
  {o:64,h:68,l:50,c:54},
  {o:54,h:64,l:51,c:62},    // 16 ← 做空3
  {o:62,h:70,l:58,c:67},    // 17 ← 做空3
  {o:67,h:70,l:52,c:56},
  {o:56,h:60,l:44,c:48},
  {o:48,h:52,l:36,c:40},
  {o:40,h:44,l:30,c:34},
];
const counterMarks = [{ spanIdx:[5,6] }, { spanIdx:[11,12] }, { spanIdx:[16,17] }];
const counterDelay = [900, 1900, 2900];

let mode = 'trend';
let animStart = null;
let animId = null;

function toY(p, minP, maxP) { return PAD.t + CH * (1 - (p - minP) / (maxP - minP)); }
function toX(i, n) { return PAD.l + (i + 0.5) * (CW / n); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function drawSpanCircle(candles, spanIdx, n, minP, maxP, barW, color, label, labelBelow, t) {
  const scale = easeOutBack(Math.min(t, 1));
  const xs = spanIdx.map(i => toX(i, n));
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;

  let yTop, yBot;
  if (labelBelow) {
    const lows  = spanIdx.map(i => toY(candles[i].l, minP, maxP));
    const tops  = spanIdx.map(i => toY(candles[i].h, minP, maxP));
    yBot = Math.max(...lows) + 8;
    yTop = Math.min(...tops) - 8;
  } else {
    const highs  = spanIdx.map(i => toY(candles[i].h, minP, maxP));
    const lows   = spanIdx.map(i => toY(candles[i].l, minP, maxP));
    yTop = Math.min(...highs) - 8;
    yBot = Math.max(...lows) + 8;
  }

  const halfH = Math.max((yBot - yTop) / 2, 16);
  const halfW = (Math.max(...xs) - Math.min(...xs)) / 2 + barW / 2 + 14;
  const cy = (yTop + yBot) / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  // 純空心描邊，無填色
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.globalAlpha = t * 0.92;
  ctx.beginPath();
  ctx.ellipse(cx, cy, halfW, halfH, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;

  if (t > 0.5) {
    const la = Math.min(1, (t - 0.5) / 0.5);
    ctx.globalAlpha = la;
    ctx.fillStyle = color;
    ctx.font = '600 28px PingFang TC, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, cx, labelBelow ? yBot + 44 : yTop - 18);
    ctx.globalAlpha = 1;
  }
}

function drawFrame(ts) {
  if (!animStart) animStart = ts;
  const elapsed = ts - animStart;
  const isTrend = mode === 'trend';
  const candles = isTrend ? trendCandles : counterCandles;
  const marks   = isTrend ? trendMarks   : counterMarks;
  const delays  = isTrend ? trendDelay   : counterDelay;
  const n = candles.length;
  const TOTAL_DUR = isTrend ? 4500 : 5500;
  const progress = Math.min(1, elapsed / TOTAL_DUR);
  const barCount = Math.floor(easeOut(progress) * n);

  const allPrices = candles.flatMap(c => [c.h, c.l]);
  const minP = Math.min(...allPrices) - 6;
  const maxP = Math.max(...allPrices) + 6;
  const barW = CW / n * 0.52;

  ctx.clearRect(0, 0, W, H);

  for (let i = 1; i <= 6; i++) {
    const y = PAD.t + CH * (i / 7);
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
    const price = Math.round(minP + (maxP - minP) * (1 - i / 7));
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.font = '22px PingFang TC, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(price, PAD.l - 12, y + 8);
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, PAD.t + CH + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t + CH); ctx.lineTo(W - PAD.r + 10, PAD.t + CH); ctx.stroke();

  if (barCount > 3) {
    const endI = Math.min(barCount - 1, n - 1);
    ctx.strokeStyle = isTrend ? '#18499A' : RED;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([14, 9]);
    ctx.globalAlpha = 0.38;
    ctx.beginPath();
    if (isTrend) {
      ctx.moveTo(toX(0, n), toY(41, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(41 + endI * 5.2, minP, maxP));
    } else {
      ctx.moveTo(toX(0, n), toY(132, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(132 - endI * 4.5, minP, maxP));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  for (let i = 0; i < barCount; i++) {
    const c = candles[i];
    const x = toX(i, n);
    const yH = toY(c.h, minP, maxP);
    const yL = toY(c.l, minP, maxP);
    const yO = toY(c.o, minP, maxP);
    const yC = toY(c.c, minP, maxP);
    const up = c.c >= c.o;
    ctx.strokeStyle = up ? GREEN : RED;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
    ctx.fillStyle = up ? GREEN : RED;
    const top = Math.min(yO, yC);
    const bh = Math.max(Math.abs(yO - yC), 3);
    ctx.fillRect(x - barW / 2, top, barW, bh);
  }

  marks.forEach((m, idx) => {
    const t = Math.max(0, Math.min(1, (elapsed - delays[idx]) / 550));
    if (t <= 0) return;
    if (!m.spanIdx.every(i => i < barCount)) return;
    if (isTrend) {
      drawSpanCircle(trendCandles, m.spanIdx, n, minP, maxP, barW, RED, '買入', true, t);
    } else {
      drawSpanCircle(counterCandles, m.spanIdx, n, minP, maxP, barW, RED, '做空', false, t);
    }
  });

  const lastDelay = delays[delays.length - 1];
  if (progress < 1 || elapsed < lastDelay + 900) {
    animId = requestAnimationFrame(drawFrame);
  }
}

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  animStart = null;
  animId = requestAnimationFrame(drawFrame);
}

function switchMode(m) {
  mode = m;
  const isTrend = m === 'trend';
  document.getElementById('btn-trend').className   = 'toggle-btn' + (isTrend  ? ' active-up'   : '');
  document.getElementById('btn-counter').className = 'toggle-btn' + (!isTrend ? ' active-down' : '');
  document.getElementById('dot-0').className = 'dot' + (isTrend  ? ' active-up'   : '');
  document.getElementById('dot-1').className = 'dot' + (!isTrend ? ' active-down' : '');
  document.getElementById('main-label').textContent = isTrend ? '市場上漲，找機會買入' : '市場下跌，找機會做空';
  document.getElementById('sub-label').textContent  = isTrend ? '順著趨勢方向操作，勝率更高' : '逆著趨勢操作，風險更大';
  startAnim();
}

startAnim();
</script>
</body>
</html>
