<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>順勢交易</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; }
  #app { width: 1080px; height: 1920px; display: flex; flex-direction: column; align-items: center; background: #fff; }
  .toggle-bar { display: flex; margin-top: 160px; background: #f0f0f0; border-radius: 60px; padding: 8px; width: 720px; }
  .toggle-btn { flex: 1; height: 96px; border: none; border-radius: 52px; font-size: 40px; font-weight: 600; cursor: pointer; transition: background 0.3s, color 0.3s, box-shadow 0.3s; letter-spacing: 2px; background: transparent; color: #999; }
  .toggle-btn.active-up   { background: #18499A; color: #fff; box-shadow: 0 6px 24px rgba(24,73,154,0.25); }
  .toggle-btn.active-down { background: #E24B4A; color: #fff; box-shadow: 0 6px 24px rgba(226,75,74,0.25); }
  .chart-wrap { margin-top: 100px; width: 1000px; height: 1400px; }
  canvas#kc   { width: 1000px; height: 1400px; display: block; }
  .dot-row    { display: flex; gap: 18px; margin-top: 60px; justify-content: center; }
  .dot        { width: 18px; height: 18px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
  .dot.active-up   { background: #18499A; }
  .dot.active-down { background: #E24B4A; }
</style>
</head>
<body>
<div id="app">
  <div class="toggle-bar">
    <button class="toggle-btn active-up"  id="btn-up"   onclick="switchMode('up')">上漲順勢</button>
    <button class="toggle-btn"            id="btn-down" onclick="switchMode('down')">下跌順勢</button>
  </div>
  <div class="chart-wrap">
    <canvas id="kc" width="1000" height="1400"></canvas>
  </div>
  <div class="dot-row">
    <div class="dot active-up" id="dot-0"></div>
    <div class="dot"           id="dot-1"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('kc');
const ctx    = canvas.getContext('2d');
const W = 1000, H = 1400;
const PAD = { l:72, r:36, t:50, b:60 };
const CW = W - PAD.l - PAD.r;
const CH = H - PAD.t - PAD.b;
const GREEN = '#26a96c';
const RED   = '#E24B4A';

const upCandles = [
  {o:44,h:50,l:40,c:48},
  {o:48,h:56,l:44,c:54},
  {o:54,h:62,l:50,c:60},
  {o:60,h:68,l:56,c:66},
  {o:66,h:69,l:53,c:56},
  {o:56,h:60,l:49,c:52},
  {o:52,h:64,l:50,c:62},
  {o:62,h:74,l:59,c:72},
  {o:72,h:84,l:68,c:82},
  {o:82,h:92,l:78,c:90},
  {o:90,h:98,l:86,c:95},
  {o:95,h:98,l:80,c:83},
  {o:83,h:87,l:76,c:79},
  {o:79,h:92,l:76,c:90},
  {o:90,h:104,l:87,c:102},
  {o:102,h:116,l:99,c:114},
  {o:114,h:128,l:111,c:126},
  {o:126,h:140,l:123,c:138},
];
const upMarks  = [{ spanIdx:[4,5] }, { spanIdx:[11,12] }];
const upDelay  = [1300, 2600];

const downCandles = [
  {o:130,h:136,l:126,c:132},
  {o:132,h:138,l:128,c:135},
  {o:135,h:140,l:130,c:133},
  {o:133,h:136,l:112,c:115},
  {o:115,h:119,l:96,c:100},
  {o:100,h:104,l:86,c:90},
  {o:90,h:100,l:87,c:98},
  {o:98,h:110,l:95,c:108},
  {o:108,h:120,l:105,c:117},
  {o:117,h:126,l:113,c:122},
  {o:122,h:125,l:102,c:106},
  {o:106,h:110,l:86,c:90},
  {o:90,h:94,l:72,c:76},
  {o:76,h:80,l:60,c:64},
  {o:64,h:74,l:61,c:72},
  {o:72,h:84,l:69,c:82},
  {o:82,h:94,l:79,c:91},
  {o:91,h:100,l:87,c:96},
  {o:96,h:99,l:76,c:80},
  {o:80,h:84,l:62,c:66},
  {o:66,h:70,l:50,c:54},
  {o:54,h:64,l:51,c:62},
  {o:62,h:72,l:59,c:70},
  {o:70,h:80,l:67,c:77},
  {o:77,h:80,l:58,c:62},
  {o:62,h:66,l:46,c:50},
  {o:50,h:54,l:36,c:40},
];
const downMarks = [{ spanIdx:[8,9] }, { spanIdx:[16,17] }, { spanIdx:[22,23] }];
const downDelay = [1100, 2300, 3500];

let mode      = 'up';
let animStart = null;
let animId    = null;

function toY(p, minP, maxP) { return PAD.t + CH * (1 - (p - minP) / (maxP - minP)); }
function toX(i, n)          { return PAD.l + (i + 0.5) * (CW / n); }
function easeOut(t)         { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function drawCircle(candles, spanIdx, n, minP, maxP, barW, color, label, atTop, t) {
  const scale = easeOutBack(Math.min(t, 1));
  const xs    = spanIdx.map(i => toX(i, n));
  const cx    = (Math.min(...xs) + Math.max(...xs)) / 2;
  const highs = spanIdx.map(i => toY(candles[i].h, minP, maxP));
  const lows  = spanIdx.map(i => toY(candles[i].l, minP, maxP));
  const yTop  = Math.min(...highs) - 10;
  const yBot  = Math.max(...lows)  + 10;
  const halfH = Math.max((yBot - yTop) / 2, 18);
  const halfW = (Math.max(...xs) - Math.min(...xs)) / 2 + barW / 2 + 16;
  const cy    = (yTop + yBot) / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);
  ctx.strokeStyle = color;
  ctx.lineWidth   = 4;
  ctx.globalAlpha = t * 0.92;
  ctx.beginPath();
  ctx.ellipse(cx, cy, halfW, halfH, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;

  if (t > 0.5) {
    const la = Math.min(1, (t - 0.5) / 0.5);
    ctx.globalAlpha = la;
    ctx.fillStyle   = color;
    ctx.font        = '600 30px PingFang TC, sans-serif';
    ctx.textAlign   = 'center';
    ctx.fillText(label, cx, atTop ? yTop - 20 : yBot + 48);
    ctx.globalAlpha = 1;
  }
}

function drawFrame(ts) {
  if (!animStart) animStart = ts;
  const elapsed  = ts - animStart;
  const isUp     = mode === 'up';
  const candles  = isUp ? upCandles   : downCandles;
  const marks    = isUp ? upMarks     : downMarks;
  const delays   = isUp ? upDelay     : downDelay;
  const n        = candles.length;
  const TOTAL    = isUp ? 4500 : 6000;
  const progress = Math.min(1, elapsed / TOTAL);
  const barCount = Math.floor(easeOut(progress) * n);

  const allPrices = candles.flatMap(c => [c.h, c.l]);
  const minP = Math.min(...allPrices) - 8;
  const maxP = Math.max(...allPrices) + 8;
  const barW = CW / n * 0.52;

  ctx.clearRect(0, 0, W, H);

  // grid
  for (let i = 1; i <= 6; i++) {
    const y = PAD.t + CH * (i / 7);
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
    const price = Math.round(minP + (maxP - minP) * (1 - i / 7));
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.font = '26px PingFang TC, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(price, PAD.l - 12, y + 10);
  }

  // axes
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, PAD.t + CH + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t + CH); ctx.lineTo(W - PAD.r + 10, PAD.t + CH); ctx.stroke();

  // trend line
  if (barCount > 3) {
    const endI = Math.min(barCount - 1, n - 1);
    ctx.strokeStyle = isUp ? '#18499A' : RED;
    ctx.lineWidth   = 2.5;
    ctx.setLineDash([14, 9]);
    ctx.globalAlpha = 0.38;
    ctx.beginPath();
    if (isUp) {
      ctx.moveTo(toX(0, n), toY(42, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(42 + endI * 5.4, minP, maxP));
    } else {
      ctx.moveTo(toX(0, n), toY(137, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(137 - endI * 3.7, minP, maxP));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // candles
  for (let i = 0; i < barCount; i++) {
    const c  = candles[i];
    const x  = toX(i, n);
    const yH = toY(c.h, minP, maxP);
    const yL = toY(c.l, minP, maxP);
    const yO = toY(c.o, minP, maxP);
    const yC = toY(c.c, minP, maxP);
    const up = c.c >= c.o;
    ctx.strokeStyle = up ? GREEN : RED;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
    ctx.fillStyle = up ? GREEN : RED;
    const top = Math.min(yO, yC);
    const bh  = Math.max(Math.abs(yO - yC), 3);
    ctx.fillRect(x - barW / 2, top, barW, bh);
  }

  // circles
  marks.forEach((m, idx) => {
    const t = Math.max(0, Math.min(1, (elapsed - delays[idx]) / 580));
    if (t <= 0) return;
    if (!m.spanIdx.every(i => i < barCount)) return;
    if (isUp) {
      drawCircle(upCandles,   m.spanIdx, n, minP, maxP, barW, RED, '買入', false, t);
    } else {
      drawCircle(downCandles, m.spanIdx, n, minP, maxP, barW, RED, '做空', true,  t);
    }
  });

  const lastDelay = delays[delays.length - 1];
  if (progress < 1 || elapsed < lastDelay + 900) {
    animId = requestAnimationFrame(drawFrame);
  }
}

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  animStart = null;
  animId = requestAnimationFrame(drawFrame);
}

function switchMode(m) {
  mode = m;
  const isUp = m === 'up';
  document.getElementById('btn-up').className   = 'toggle-btn' + (isUp  ? ' active-up'   : '');
  document.getElementById('btn-down').className = 'toggle-btn' + (!isUp ? ' active-down' : '');
  document.getElementById('dot-0').className = 'dot' + (isUp  ? ' active-up'   : '');
  document.getElementById('dot-1').className = 'dot' + (!isUp ? ' active-down' : '');
  startAnim();
}

startAnim();
</script>
</body>
</html>
