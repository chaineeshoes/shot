<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>趨勢 vs 逆勢交易</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #ffffff;
    font-family: 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', sans-serif;
  }
  #app {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
    position: relative;
  }

  .toggle-bar {
    display: flex;
    gap: 0;
    margin-top: 120px;
    background: #f0f0f0;
    border-radius: 60px;
    padding: 8px;
    width: 700px;
  }
  .toggle-btn {
    flex: 1;
    height: 90px;
    border: none;
    border-radius: 52px;
    font-size: 38px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    letter-spacing: 2px;
    background: transparent;
    color: #999;
  }
  .toggle-btn.active-up {
    background: #18499A;
    color: #fff;
    box-shadow: 0 6px 24px rgba(24,73,154,0.25);
  }
  .toggle-btn.active-down {
    background: #E24B4A;
    color: #fff;
    box-shadow: 0 6px 24px rgba(226,75,74,0.25);
  }

  .label-area {
    margin-top: 80px;
    width: 960px;
    text-align: left;
  }
  .main-label {
    font-size: 68px;
    font-weight: 700;
    color: #111;
    letter-spacing: 2px;
    line-height: 1.15;
    transition: opacity 0.3s;
  }
  .sub-label {
    font-size: 40px;
    font-weight: 400;
    color: #888;
    margin-top: 18px;
    letter-spacing: 1px;
    transition: opacity 0.3s;
  }

  .chart-wrap {
    margin-top: 60px;
    width: 1000px;
    height: 980px;
    position: relative;
  }
  canvas#kc {
    width: 1000px;
    height: 980px;
    display: block;
  }

  .dot-row {
    display: flex;
    gap: 18px;
    margin-top: 60px;
    justify-content: center;
  }
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ddd;
    transition: background 0.3s;
  }
  .dot.active { background: #18499A; }
</style>
</head>
<body>
<div id="app">
  <div class="toggle-bar">
    <button class="toggle-btn active-up" id="btn-trend" onclick="switchMode('trend')">趨勢交易</button>
    <button class="toggle-btn" id="btn-counter" onclick="switchMode('counter')">逆勢交易</button>
  </div>

  <div class="label-area">
    <div class="main-label" id="main-label">市場上漲，找機會買入</div>
    <div class="sub-label" id="sub-label">順著趨勢方向操作，勝率更高</div>
  </div>

  <div class="chart-wrap">
    <canvas id="kc" width="1000" height="980"></canvas>
  </div>

  <div class="dot-row">
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('kc');
const ctx = canvas.getContext('2d');
const W = 1000, H = 980;

const GREEN = '#00b07a';
const RED   = '#E24B4A';
const BLUE  = '#18499A';
const AMBER = '#f5a623';
const GRID  = 'rgba(0,0,0,0.05)';
const AXIS  = 'rgba(0,0,0,0.15)';
const LABEL_C = 'rgba(0,0,0,0.3)';

const PAD = { l: 70, r: 30, t: 40, b: 60 };
const CW = W - PAD.l - PAD.r;
const CH = H - PAD.t - PAD.b;

const trendCandles = [
  {o:82,h:90,l:72,c:76},
  {o:76,h:84,l:65,c:68},
  {o:68,h:74,l:55,c:60},
  {o:60,h:78,l:52,c:75},
  {o:75,h:94,l:70,c:91},
  {o:91,h:100,l:84,c:86},
  {o:86,h:94,l:74,c:76},
  {o:76,h:82,l:58,c:61},
  {o:61,h:69,l:50,c:56},
  {o:56,h:72,l:48,c:68},
  {o:68,h:90,l:64,c:87},
  {o:87,h:102,l:82,c:98},
  {o:98,h:108,l:88,c:90},
  {o:90,h:98,l:70,c:73},
  {o:73,h:80,l:60,c:64},
  {o:64,h:76,l:56,c:72},
  {o:72,h:96,l:68,c:93},
  {o:93,h:112,l:88,c:108},
  {o:108,h:120,l:102,c:116},
  {o:116,h:128,l:110,c:124},
];
const trendBuy = [3, 9, 15];
const trendBuyDelay = [700, 1250, 1800];

const counterCandles = [
  {o:60,h:68,l:55,c:65},
  {o:65,h:78,l:62,c:76},
  {o:76,h:90,l:72,c:88},
  {o:88,h:102,l:84,c:98},
  {o:98,h:112,l:84,c:86},
  {o:86,h:94,l:60,c:62},
  {o:62,h:70,l:56,c:68},
  {o:68,h:82,l:64,c:80},
  {o:80,h:96,l:76,c:94},
  {o:94,h:108,l:88,c:104},
  {o:104,h:118,l:88,c:90},
  {o:90,h:96,l:60,c:63},
  {o:63,h:70,l:57,c:66},
  {o:66,h:80,l:62,c:78},
  {o:78,h:94,l:74,c:92},
  {o:92,h:108,l:86,c:106},
  {o:106,h:120,l:90,c:92},
  {o:92,h:98,l:62,c:65},
  {o:65,h:72,l:58,c:68},
  {o:68,h:84,l:64,c:82},
];
const counterSell = [4, 10, 16];
const counterSellDelay = [700, 1250, 1800];

let mode = 'trend';
let animStart = null;
let animId = null;

function getConfig() {
  if (mode === 'trend') {
    return { candles: trendCandles, marks: trendBuy, markDelay: trendBuyDelay, markColor: AMBER, trendColor: BLUE, trendUp: true, markLabel: '買入' };
  } else {
    return { candles: counterCandles, marks: counterSell, markDelay: counterSellDelay, markColor: '#E24B4A', trendColor: '#E24B4A', trendUp: false, markLabel: '賣出' };
  }
}

function toY(p, minP, maxP) { return PAD.t + CH * (1 - (p - minP) / (maxP - minP)); }
function toX(i, n) { return PAD.l + (i + 0.5) * (CW / n); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function drawFrame(ts) {
  if (!animStart) animStart = ts;
  const elapsed = ts - animStart;
  const cfg = getConfig();
  const candles = cfg.candles;
  const n = candles.length;

  const TOTAL_DUR = 2600;
  const progress = Math.min(1, elapsed / TOTAL_DUR);
  const barCount = Math.floor(easeOut(progress) * n);

  const allPrices = candles.flatMap(c => [c.h, c.l]);
  const minP = Math.min(...allPrices) - 8;
  const maxP = Math.max(...allPrices) + 8;
  const barW = CW / n * 0.52;

  ctx.clearRect(0, 0, W, H);

  for (let i = 1; i <= 6; i++) {
    const y = PAD.t + CH * (i / 7);
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
    const price = Math.round(minP + (maxP - minP) * (1 - i / 7));
    ctx.fillStyle = LABEL_C;
    ctx.font = '22px PingFang TC, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(price, PAD.l - 10, y + 8);
  }

  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, PAD.t + CH + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t + CH); ctx.lineTo(W - PAD.r + 10, PAD.t + CH); ctx.stroke();

  ctx.strokeStyle = cfg.trendColor;
  ctx.lineWidth = 2;
  ctx.setLineDash([12, 8]);
  ctx.globalAlpha = 0.35;
  if (barCount > 1) {
    const endI = Math.min(barCount - 1, n - 1);
    if (cfg.trendUp) {
      ctx.beginPath();
      ctx.moveTo(toX(0, n), toY(minP + (maxP - minP) * 0.25, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(minP + (maxP - minP) * 0.82, minP, maxP));
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(toX(0, n), toY(minP + (maxP - minP) * 0.78, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(minP + (maxP - minP) * 0.22, minP, maxP));
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  for (let i = 0; i < barCount; i++) {
    const c = candles[i];
    const x = toX(i, n);
    const yH = toY(c.h, minP, maxP);
    const yL = toY(c.l, minP, maxP);
    const yO = toY(c.o, minP, maxP);
    const yC = toY(c.c, minP, maxP);
    const up = c.c >= c.o;
    const color = up ? GREEN : RED;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
    ctx.fillStyle = color;
    const top = Math.min(yO, yC);
    const bh = Math.max(Math.abs(yO - yC), 3);
    ctx.fillRect(x - barW / 2, top, barW, bh);
  }

  cfg.marks.forEach((bi, n2) => {
    const delay = cfg.markDelay[n2];
    const t = Math.max(0, Math.min(1, (elapsed - delay) / 500));
    const scale = t > 0 ? easeOutBack(Math.min(t, 1)) : 0;

    if (t > 0 && bi < barCount) {
      const c = candles[bi];
      const cx = toX(bi, n);
      const isUp = mode === 'counter';
      const cy = isUp ? toY(c.h, minP, maxP) - 28 : toY(c.l, minP, maxP) + 28;
      const r = 34;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);

      ctx.fillStyle = mode === 'counter' ? 'rgba(226,75,74,0.1)' : 'rgba(245,166,35,0.12)';
      ctx.beginPath(); ctx.arc(cx, cy, r + 14, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = cfg.markColor;
      ctx.lineWidth = 3.5;
      ctx.globalAlpha = t * 0.95;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      ctx.restore();
      ctx.globalAlpha = 1;

      if (t > 0.55) {
        const la = Math.min(1, (t - 0.55) / 0.45);
        ctx.globalAlpha = la;
        ctx.fillStyle = cfg.markColor;
        ctx.font = '500 26px PingFang TC, sans-serif';
        ctx.textAlign = 'center';
        const labelY = isUp ? cy - r - 16 : cy + r + 32;
        ctx.fillText(cfg.markLabel, cx, labelY);
        ctx.globalAlpha = 1;
      }
    }
  });

  if (progress < 1 || elapsed < cfg.markDelay[2] + 800) {
    animId = requestAnimationFrame(drawFrame);
  }
}

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  animStart = null;
  animId = requestAnimationFrame(drawFrame);
}

function switchMode(m) {
  mode = m;

  document.getElementById('btn-trend').className = 'toggle-btn' + (m === 'trend' ? ' active-up' : '');
  document.getElementById('btn-counter').className = 'toggle-btn' + (m === 'counter' ? ' active-down' : '');

  document.getElementById('dot-0').className = 'dot' + (m === 'trend' ? ' active' : '');
  document.getElementById('dot-1').className = 'dot' + (m === 'counter' ? ' active' : '');

  if (m === 'trend') {
    document.getElementById('main-label').textContent = '市場上漲，找機會買入';
    document.getElementById('sub-label').textContent = '順著趨勢方向操作，勝率更高';
  } else {
    document.getElementById('main-label').textContent = '市場上漲，找機會賣出';
    document.getElementById('sub-label').textContent = '逆著趨勢操作，風險更大';
  }

  startAnim();
}

startAnim();
</script>
</body>
</html>
