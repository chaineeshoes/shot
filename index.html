<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>趨勢 vs 逆勢交易</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #ffffff;
    font-family: 'PingFang TC', 'Noto Sans TC', 'Helvetica Neue', sans-serif;
  }
  #app {
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
  }
  .toggle-bar {
    display: flex;
    gap: 0;
    margin-top: 120px;
    background: #f0f0f0;
    border-radius: 60px;
    padding: 8px;
    width: 720px;
  }
  .toggle-btn {
    flex: 1;
    height: 96px;
    border: none;
    border-radius: 52px;
    font-size: 40px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    letter-spacing: 2px;
    background: transparent;
    color: #999;
  }
  .toggle-btn.active-up {
    background: #18499A;
    color: #fff;
    box-shadow: 0 6px 24px rgba(24,73,154,0.25);
  }
  .toggle-btn.active-down {
    background: #E24B4A;
    color: #fff;
    box-shadow: 0 6px 24px rgba(226,75,74,0.25);
  }
  .label-area {
    margin-top: 80px;
    width: 960px;
    text-align: left;
  }
  .main-label {
    font-size: 66px;
    font-weight: 700;
    color: #111;
    letter-spacing: 2px;
    line-height: 1.15;
  }
  .sub-label {
    font-size: 38px;
    font-weight: 400;
    color: #888;
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .chart-wrap {
    margin-top: 50px;
    width: 1000px;
    height: 1020px;
    position: relative;
  }
  canvas#kc {
    width: 1000px;
    height: 1020px;
    display: block;
  }
  .dot-row {
    display: flex;
    gap: 18px;
    margin-top: 50px;
    justify-content: center;
  }
  .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ddd;
    transition: background 0.3s;
  }
  .dot.active-up { background: #18499A; }
  .dot.active-down { background: #E24B4A; }
</style>
</head>
<body>
<div id="app">
  <div class="toggle-bar">
    <button class="toggle-btn active-up" id="btn-trend" onclick="switchMode('trend')">趨勢交易</button>
    <button class="toggle-btn" id="btn-counter" onclick="switchMode('counter')">逆勢交易</button>
  </div>

  <div class="label-area">
    <div class="main-label" id="main-label">市場上漲，找機會買入</div>
    <div class="sub-label" id="sub-label">順著趨勢方向操作，勝率更高</div>
  </div>

  <div class="chart-wrap">
    <canvas id="kc" width="1000" height="1020"></canvas>
  </div>

  <div class="dot-row">
    <div class="dot active-up" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('kc');
const ctx = canvas.getContext('2d');
const W = 1000, H = 1020;
const PAD = { l: 72, r: 36, t: 40, b: 60 };
const CW = W - PAD.l - PAD.r;
const CH = H - PAD.t - PAD.b;

const GREEN = '#26a96c';
const RED   = '#E24B4A';
const BLUE  = '#18499A';
const AMBER = '#e8314a';

// 趨勢（上漲）：階梯式震盪上升，對應截圖的形狀
// 整體從左低右高，有三段明顯拉升+回踩
const trendCandles = [
  // 起始低檔橫盤
  {o:42,h:48,l:38,c:46},
  {o:46,h:52,l:40,c:44},
  {o:44,h:50,l:38,c:48},
  // 第一波拉升
  {o:48,h:58,l:45,c:56},
  {o:56,h:66,l:52,c:63},
  {o:63,h:72,l:58,c:68},
  {o:68,h:76,l:62,c:70},
  // 第一次回踩低點（買點1）
  {o:70,h:74,l:54,c:57},
  {o:57,h:62,l:50,c:54},
  {o:54,h:60,l:48,c:58},
  // 第二波拉升
  {o:58,h:70,l:55,c:68},
  {o:68,h:80,l:64,c:78},
  {o:78,h:88,l:74,c:85},
  {o:85,h:94,l:80,c:90},
  // 第二次回踩（買點2）
  {o:90,h:94,l:72,c:75},
  {o:75,h:80,l:68,c:72},
  {o:72,h:78,l:65,c:74},
  // 第三波強勢拉升
  {o:74,h:88,l:70,c:86},
  {o:86,h:98,l:82,c:96},
  {o:96,h:110,l:92,c:108},
  {o:108,h:122,l:104,c:119},
  {o:119,h:132,l:115,c:129},
];
const trendBuy = [8, 15];
const trendBuyDelay = [820, 1500];

// 逆勢（下跌）：從高點震盪下跌，對應截圖下跌走勢
// 整體從左高右低，有三段下跌+反彈
const counterCandles = [
  // 高點起始
  {o:122,h:130,l:116,c:125},
  {o:125,h:132,l:118,c:120},
  {o:120,h:126,l:112,c:116},
  // 第一波急跌
  {o:116,h:120,l:100,c:103},
  {o:103,h:108,l:94,c:98},
  {o:98,h:104,l:88,c:92},
  // 反彈
  {o:92,h:106,l:88,c:103},
  {o:103,h:114,l:98,c:110},
  {o:110,h:118,l:104,c:108},
  // 第二波下跌
  {o:108,h:112,l:92,c:95},
  {o:95,h:100,l:84,c:88},
  {o:88,h:94,l:76,c:80},
  // 小反彈
  {o:80,h:92,l:76,c:89},
  {o:89,h:98,l:84,c:94},
  // 第三波急跌延續
  {o:94,h:98,l:78,c:81},
  {o:81,h:86,l:68,c:72},
  {o:72,h:78,l:60,c:64},
  {o:64,h:70,l:52,c:56},
  // 末段微反彈後繼續跌
  {o:56,h:66,l:52,c:62},
  {o:62,h:68,l:48,c:51},
  {o:51,h:56,l:42,c:46},
  {o:46,h:52,l:36,c:40},
];
const counterSell = [6, 12];
const counterSellDelay = [820, 1500];

let mode = 'trend';
let animStart = null;
let animId = null;

function toY(p, minP, maxP) { return PAD.t + CH * (1 - (p - minP) / (maxP - minP)); }
function toX(i, n) { return PAD.l + (i + 0.5) * (CW / n); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function drawFrame(ts) {
  if (!animStart) animStart = ts;
  const elapsed = ts - animStart;

  const isTrend = mode === 'trend';
  const candles = isTrend ? trendCandles : counterCandles;
  const marks = isTrend ? trendBuy : counterSell;
  const markDelay = isTrend ? trendBuyDelay : counterSellDelay;
  const trendColor = isTrend ? BLUE : RED;
  const markColor = isTrend ? AMBER : '#ff6b35';
  const markLabel = isTrend ? '買入' : '賣出';

  const n = candles.length;
  const TOTAL_DUR = 2800;
  const progress = Math.min(1, elapsed / TOTAL_DUR);
  const barCount = Math.floor(easeOut(progress) * n);

  const allPrices = candles.flatMap(c => [c.h, c.l]);
  const minP = Math.min(...allPrices) - 6;
  const maxP = Math.max(...allPrices) + 6;
  const barW = CW / n * 0.50;

  ctx.clearRect(0, 0, W, H);

  // grid
  for (let i = 1; i <= 6; i++) {
    const y = PAD.t + CH * (i / 7);
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
    const price = Math.round(minP + (maxP - minP) * (1 - i / 7));
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.font = '22px PingFang TC, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(price, PAD.l - 12, y + 8);
  }

  // axes
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, PAD.t + CH + 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t + CH); ctx.lineTo(W - PAD.r + 10, PAD.t + CH); ctx.stroke();

  // trend line
  if (barCount > 3) {
    const endI = Math.min(barCount - 1, n - 1);
    ctx.strokeStyle = trendColor;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([14, 9]);
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    if (isTrend) {
      ctx.moveTo(toX(0, n), toY(39, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(39 + endI * 4.3, minP, maxP));
    } else {
      ctx.moveTo(toX(0, n), toY(128, minP, maxP));
      ctx.lineTo(toX(endI, n), toY(128 - endI * 4.0, minP, maxP));
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // candles
  for (let i = 0; i < barCount; i++) {
    const c = candles[i];
    const x = toX(i, n);
    const yH = toY(c.h, minP, maxP);
    const yL = toY(c.l, minP, maxP);
    const yO = toY(c.o, minP, maxP);
    const yC = toY(c.c, minP, maxP);
    const up = c.c >= c.o;
    const color = up ? GREEN : RED;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();

    ctx.fillStyle = color;
    const top = Math.min(yO, yC);
    const bh = Math.max(Math.abs(yO - yC), 3);
    ctx.fillRect(x - barW / 2, top, barW, bh);
  }

  // buy/sell circles
  marks.forEach((bi, idx) => {
    const t = Math.max(0, Math.min(1, (elapsed - markDelay[idx]) / 500));
    const scale = t > 0 ? easeOutBack(Math.min(t, 1)) : 0;

    if (t > 0 && bi < barCount) {
      const c = candles[bi];
      const cx = toX(bi, n);
      const atTop = !isTrend;
      const cy = atTop
        ? toY(c.h, minP, maxP) - 32
        : toY(c.l, minP, maxP) + 32;
      const r = 38;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);

      ctx.fillStyle = isTrend ? 'rgba(232,49,74,0.08)' : 'rgba(226,75,74,0.1)';
      ctx.beginPath(); ctx.arc(cx, cy, r + 16, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = markColor;
      ctx.lineWidth = 4;
      ctx.globalAlpha = t * 0.92;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

      ctx.restore();
      ctx.globalAlpha = 1;

      if (t > 0.55) {
        const la = Math.min(1, (t - 0.55) / 0.45);
        ctx.globalAlpha = la;
        ctx.fillStyle = markColor;
        ctx.font = '600 28px PingFang TC, sans-serif';
        ctx.textAlign = 'center';
        const labelY = atTop ? cy - r - 18 : cy + r + 36;
        ctx.fillText(markLabel, cx, labelY);
        ctx.globalAlpha = 1;
      }
    }
  });

  if (progress < 1 || elapsed < markDelay[markDelay.length - 1] + 800) {
    animId = requestAnimationFrame(drawFrame);
  }
}

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  animStart = null;
  animId = requestAnimationFrame(drawFrame);
}

function switchMode(m) {
  mode = m;
  const isTrend = m === 'trend';

  document.getElementById('btn-trend').className = 'toggle-btn' + (isTrend ? ' active-up' : '');
  document.getElementById('btn-counter').className = 'toggle-btn' + (!isTrend ? ' active-down' : '');
  document.getElementById('dot-0').className = 'dot' + (isTrend ? ' active-up' : '');
  document.getElementById('dot-1').className = 'dot' + (!isTrend ? ' active-down' : '');

  document.getElementById('main-label').textContent = isTrend
    ? '市場上漲，找機會買入'
    : '市場下跌，找機會賣出';
  document.getElementById('sub-label').textContent = isTrend
    ? '順著趨勢方向操作，勝率更高'
    : '逆著趨勢操作，風險更大';

  startAnim();
}

startAnim();
</script>
</body>
</html>
